<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visper 设计画布</title>
    <link rel="icon" href="./app-icon-512.png" />
    <link rel="stylesheet" href="./product.css" />
    <link rel="stylesheet" href="./src/canvas.css" />
  </head>
  <body>
    <div id="viewport">
      <div id="world"></div>
    </div>
    <header id="hud">
      <div class="hud-title">
        <strong>Visper 设计画布</strong>
        <span>V 选择 · H 平移 · 空格拖移 · ⌘/Ctrl 滚轮缩放</span>
      </div>
      <div class="hud-tools">
        <button type="button" id="mode-select" class="is-on" title="选择元素 (V)">选择</button>
        <button type="button" id="mode-pan" title="平移 (H)">平移</button>
        <span class="hud-gap"></span>
        <button type="button" id="zoom-fit" title="适应画布 (0)">适应</button>
        <button type="button" id="zoom-100" title="实际大小 (1)">100%</button>
        <span id="zoom-label">100%</span>
        <label class="hud-jump">
          跳转
          <select id="jump"></select>
        </label>
        <a id="index-link" href="./element-index.json">元素索引</a>
      </div>
    </header>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
