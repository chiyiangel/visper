[package]
name = "visper"
version = "0.1.0"
edition = "2024"
description = "Local, offline transcription of Chinese and English recordings with Whisper large-v3"
authors = ["Liu Jun <chiyiangel@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/chiyiangel/visper"
homepage = "https://github.com/chiyiangel/visper"
readme = "README.md"
keywords = ["whisper", "transcription", "speech-to-text", "gpui", "offline"]
categories = ["multimedia::audio", "gui"]
# A desktop app, not a library for crates.io.
publish = false

[[bin]]
name = "visper"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:gpui", "dep:libc", "dep:ureq", "dep:whisper-rs", "dep:symphonia", "dep:rubato", "dep:rodio", "dep:cocoa", "dep:dunce", "dep:windows-sys"]

[dependencies]
dunce = { version = "1", optional = true }
ferrous-opencc = "0.4"
gpui = { version = "0.2", optional = true }
libc = { version = "0.2", optional = true }
ureq = { version = "3", optional = true }
# The GPU backend is chosen per platform below (ADR 0003).
whisper-rs = { version = "0.16", optional = true }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "flac", "wav", "pcm", "adpcm"], optional = true }
rubato = { version = "0.16", optional = true }
rodio = { version = "0.21", default-features = false, features = ["playback", "flac", "mp3", "mp4", "wav"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The version GPUI already uses, for the Dock icon in `src/dock.rs`.
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = { version = "=0.26.0", optional = true }
# Inference on Metal on macOS, Vulkan elsewhere.
whisper-rs = { version = "0.16", features = ["metal"], optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16", features = ["vulkan"], optional = true }

# The named pipe that keeps one Visper per user, in `src/instance.rs`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

[dev-dependencies]
# Hit-target lookup for the menu click test.
gpui = { version = "0.2", features = ["test-support"] }

# Decoding and resampling are far too slow unoptimized: a 90-minute MP3 took
# minutes before transcription began under `cargo run`, against ~8 s here.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
