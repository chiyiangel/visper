name: Release

# Pushing a version tag (v*) builds the packages and publishes a GitHub
# Release with the built-in GITHUB_TOKEN. workflow_dispatch runs the same
# builds; a release is created only when the selected ref is a version tag.
# There is no Developer ID signing or notarization: the macOS disk image is
# ad hoc signed, and Gatekeeper blocks it until the user allows the app.
on:
  push:
    tags:
      - "v*"
    # Verification build for this branch. Artifacts only; publish stays
    # skipped because the ref is not a tag. Remove this branches filter
    # once that run is green.
    branches:
      - "cursor/release-binaries-a9ab"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # CFBundleVersion is the commit count. A shallow clone would pin it at 1.
          fetch-depth: 0

      # whisper.cpp builds with Metal here; CMake ships with the runner image.
      # macos-latest is Apple Silicon. The release ships that slice only.
      - uses: Swatinem/rust-cache@v2

      - name: Confirm the runner architecture
        run: |
          set -eu
          actual=$(uname -m)
          if [ "$actual" != "arm64" ]; then
            echo "runner is $actual, expected arm64" >&2
            exit 1
          fi

      - name: Bundle disk image
        run: scripts/bundle-macos.sh --dmg

      - name: Check the disk image
        run: |
          set -eu
          binary=target/release/bundle/Visper.app/Contents/MacOS/visper
          slice=$(lipo -archs "$binary")
          echo "slice: $slice"
          if [ "$slice" != "arm64" ]; then
            echo "expected an arm64 binary, got: $slice" >&2
            exit 1
          fi
          codesign -dv "$binary" 2>&1
          dmg=(target/release/bundle/Visper-*-arm64.dmg)
          if [ ! -f "${dmg[0]}" ]; then
            echo "missing arm64 disk image" >&2
            ls -l target/release/bundle >&2
            exit 1
          fi
          ls -lh "${dmg[0]}"

      - uses: actions/upload-artifact@v4
        with:
          name: visper-macos-arm64
          path: target/release/bundle/Visper-*-arm64.dmg
          retention-days: 14
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # whisper.cpp's Vulkan backend needs the SDK (headers, loader, glslc) to
      # build. The action sets VULKAN_SDK. The shipped exe loads vulkan-1.dll
      # from the user's GPU driver, not from this SDK.
      - uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          install_runtime: true
          cache: true
          stripdown: true

      # MSBuild cannot write paths over 260 characters, and whisper.cpp's
      # shader generator build nests deep enough under target\release to cross
      # it. A target directory next to the checkout keeps it under.
      - name: Use a short target directory
        shell: pwsh
        run: echo "CARGO_TARGET_DIR=$((Resolve-Path ..).Path)\t" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> ../t"

      - name: Build
        run: cargo build --release

      - name: Package zip
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if (-not $version) { throw "version missing from Cargo.toml" }
          $release = Join-Path $env:CARGO_TARGET_DIR "release"
          $exe = Join-Path $release "visper.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $stage = Join-Path $release "win-package"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item $exe (Join-Path $stage "visper.exe")
          @(
            "Visper for Windows (x86_64)."
            ""
            "Run visper.exe."
            ""
            "Needs a GPU driver that provides vulkan-1.dll (current NVIDIA, AMD and Intel drivers do). Without it Visper does not start."
            "Also needs the Microsoft Visual C++ Redistributable:"
            "https://learn.microsoft.com/cpp/windows/latest-supported-vc-redist"
            ""
            "The Whisper model (about 3.1 GB) downloads on first launch into %LOCALAPPDATA%\Visper\."
          ) | Set-Content -Encoding utf8NoBOM -Path (Join-Path $stage "README.txt")
          $zip = Join-Path $release "Visper-$version-windows-x86_64.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
          } finally {
            $archive.Dispose()
          }
          Write-Host ($names -join ", ")
          if ($names -notcontains "visper.exe") { throw "zip is missing visper.exe: $($names -join ', ')" }
          echo "ZIP_PATH=$zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: visper-windows-x86_64
          path: ${{ env.ZIP_PATH }}
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: visper-*
          path: dist
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          assets=(Visper-*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "no Visper assets to publish" >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          printf '%s\n' "${assets[@]}" | sort > actual.txt
          printf '%s\n' \
            "Visper-${tag_version}-arm64.dmg" \
            "Visper-${tag_version}-windows-x86_64.zip" | sort > expected.txt
          if ! cmp -s actual.txt expected.txt; then
            echo "release assets must be the Apple Silicon disk image and the Windows zip for $GITHUB_REF_NAME" >&2
            echo "Bump version in Cargo.toml to $tag_version before tagging." >&2
            diff -u expected.txt actual.txt >&2 || true
            exit 1
          fi
          sha256sum "${assets[@]}" > SHA256SUMS
          ls -lh
          notes=$(mktemp)
          cat >"$notes" <<EOF
          ## macOS

          \`Visper-${tag_version}-arm64.dmg\` is the Apple Silicon build.

          Open the disk image and drag Visper to Applications.

          This build is ad hoc signed (\`codesign --sign -\`) and is not notarized. Gatekeeper treats a downloaded copy as unsigned and blocks the first launch.

          1. Control-click \`Visper.app\` and choose **Open**, then **Open** again.
          2. If macOS still blocks it, open **System Settings → Privacy & Security** and click **Open Anyway**.
          3. If macOS reports that the app is damaged, clear the quarantine flag and open it again:

          \`\`\`bash
          xattr -dr com.apple.quarantine /Applications/Visper.app
          \`\`\`

          ## Windows

          \`Visper-${tag_version}-windows-x86_64.zip\` contains \`visper.exe\`.

          - A GPU driver that provides \`vulkan-1.dll\` (current NVIDIA, AMD and Intel drivers do). Without it Visper does not start.
          - The [Microsoft Visual C++ Redistributable](https://learn.microsoft.com/cpp/windows/latest-supported-vc-redist).

          The Whisper model (about 3.1 GB) downloads on first launch.
          EOF
          extra=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            extra+=(--prerelease)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" SHA256SUMS --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes" "${extra[@]}"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" SHA256SUMS \
              --title "Visper $GITHUB_REF_NAME" \
              --notes-file "$notes" \
              "${extra[@]}"
          fi
