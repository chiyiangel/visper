name: Feature request / 功能建议
description: Suggest an improvement. / 提出改进建议。
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Visper is intentionally small. Please check the "Out of scope" section of the README first.
        Visper 有意保持精简，提交前请先看 README 中“不做的事”一节。
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve? / 想解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen? / 你希望怎样？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered / 考虑过的其他方案
